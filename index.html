<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WHITE To Do List</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(#1f4037, #000);
            padding: 15px;
        }

        /* MAIN CONTAINER */
        .todo-container {
            width: 100%;
            max-width: 420px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* TITLE */
        .todo-title {
            text-align: center;
            color: #00ff88;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* INPUT */
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-box input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
        }

        .input-box button {
            width: 45px;
            border: none;
            border-radius: 12px;
            background: #00ff88;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* LIST */
        .todo-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .todo-list::-webkit-scrollbar {
            width: 4px;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 10px;
        }

        /* TASK */
        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #00ff88;
            cursor: pointer;
        }

        .check.active {
            background: #00ff88;
            position: relative;
        }

        .check.active::before {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: black;
        }

        .task-text {
            color: white;
            font-size: 14px;
            word-break: break-word;
        }

        .task.completed .task-text {
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* DELETE */
        .delete-btn {
            background: rgba(255, 0, 0, 0.15);
            color: #ff4d4d;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* STATS */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #ccc;
            font-size: 13px;
        }

        /* EMPTY */
        .empty {
            text-align: center;
            color: #aaa;
            padding: 20px;
        }

        /* TAG */
        .nametag {
            position: fixed;
            bottom: 5px;
            font-size: 10px;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="todo-container">

        <h1 class="todo-title"> WHITE <br>To Do List</h1>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter your task...">
            <button onclick="addTask()">+</button>
        </div>

        <div class="todo-list" id="todoList"></div>

        <div class="stats">
            <span id="totalTasks">0 Tasks</span>
            <span id="completedTasks">0 Completed</span>
        </div>

    </div>

    <div class="nametag">Made by Wenxyz</div>

    <script>

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function renderTasks() {

            const list = document.getElementById("todoList");

            list.innerHTML = "";

            if (tasks.length === 0) {

                list.innerHTML = `
            <div class="empty">
                ✨ No tasks yet
            </div>
        `;

            }

            tasks.forEach((task, index) => {

                const div = document.createElement("div");

                div.className = task.completed ? "task completed" : "task";

                div.innerHTML = `

            <div class="task-left">

                <div class="check ${task.completed ? "active" : ""}"
                onclick="toggleTask(${index})"></div>

                <div class="task-text">
                    ${task.text}
                </div>

            </div>

            <button class="delete-btn"
            onclick="deleteTask(${index})">
            ✖
            </button>

        `;

                list.appendChild(div);

            });

            updateStats();

        }

        function addTask() {

            const input = document.getElementById("taskInput");

            const text = input.value.trim();

            if (text === "") return;

            tasks.unshift({
                text: text,
                completed: false
            });

            saveTasks();

            renderTasks();

            input.value = "";

            // 🔥 AUTO SCROLL TOP
            const list = document.getElementById("todoList");

            list.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

        function toggleTask(index) {

            tasks[index].completed = !tasks[index].completed;

            saveTasks();

            renderTasks();

        }

        function deleteTask(index) {

            tasks.splice(index, 1);

            saveTasks();

            renderTasks();

        }

        function updateStats() {

            document.getElementById("totalTasks").innerText =
                tasks.length + " Tasks";

            const completed = tasks.filter(t => t.completed).length;

            document.getElementById("completedTasks").innerText =
                completed + " Completed";

        }

        document.getElementById("taskInput")
            .addEventListener("keypress", (e) => {

                if (e.key === "Enter") {
                    addTask();
                }

            });

        renderTasks();



    </script>

</body>

</html>
